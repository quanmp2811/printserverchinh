services:
  - type: web
    name: pdf-print-render
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PRINTER_DOTS_WIDTH
        value: "384"
      - key: SELF_URL
        sync: false
